<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Control System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #videoCanvas {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .slider-container {
            flex: 1;
            min-width: 200px;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            outline: none;
        }
        .stats-section h2 {
            margin-bottom: 15px;
            color: #ffd700;
        }
        .priority-box {
            background: rgba(255,68,68,0.2);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .priority-box h3 {
            font-size: 1.5em;
            color: #ff4444;
        }
        .metrics-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .metric-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #00ff88;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            background: rgba(255,255,255,0.1);
            font-weight: bold;
            color: #ffd700;
        }
        tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .congested {
            color: #ff4444;
            font-weight: bold;
        }
        .normal {
            color: #00ff88;
        }
        #fileInput {
            display: none;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        .status.success { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status.error { background: rgba(255,68,68,0.2); color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚦 Traffic Control & Optimization System</h1>
        
        <div class="main-grid">
            <div class="card video-section">
                <h2>📹 Live Traffic Feed</h2>
                <canvas id="videoCanvas" width="800" height="600"></canvas>
                
                <div class="controls">
                    <input type="file" id="fileInput" accept="video/*,image/*">
                    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                        📁 Load Video/Image
                    </button>
                    <button class="btn-success" id="startBtn" onclick="startProcessing()">
                        ▶️ Start
                    </button>
                    <button class="btn-danger" id="stopBtn" onclick="stopProcessing()" disabled>
                        ⏹️ Stop
                    </button>
                    
                    <div class="slider-container">
                        <label>Confidence: <span id="confValue">0.40</span></label>
                        <input type="range" id="confidence" min="0.1" max="0.9" step="0.05" value="0.4" 
                               oninput="document.getElementById('confValue').textContent = this.value">
                    </div>
                </div>
                
                <div id="status" class="status" style="display:none;"></div>
            </div>
            
            <div class="card stats-section">
                <h2>📊 Traffic Analytics</h2>
                
                <div class="priority-box">
                    <div class="metric-label">Priority Road</div>
                    <h3 id="priorityRoad">Road 1</h3>
                    <div id="priorityTime" style="color: #ffd700; margin-top: 5px;">Green: 30s</div>
                </div>
                
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Total Vehicles</div>
                        <div class="metric-value" id="totalVehicles">0</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Avg Accuracy</div>
                        <div class="metric-value" id="avgAccuracy">0%</div>
                    </div>
                </div>
                
                <div id="congestedInfo" style="padding: 10px; background: rgba(255,165,0,0.2); border-radius: 5px; margin-top: 10px; display: none;">
                    <strong>⚠️ Congested Roads:</strong> <span id="congestedList"></span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>📈 Detailed Metrics</h2>
            <table id="metricsTable">
                <thead>
                    <tr>
                        <th>Road</th>
                        <th>Vehicles</th>
                        <th>Density %</th>
                        <th>Green Time</th>
                        <th>Wait Time</th>
                        <th>Accuracy %</th>
                        <th>Precision %</th>
                        <th>Recall %</th>
                        <th>F1 Score %</th>
                    </tr>
                </thead>
                <tbody id="metricsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let video, canvas, ctx, processing = false, videoFile = null;
        
        window.onload = function() {
            canvas = document.getElementById('videoCanvas');
            ctx = canvas.getContext('2d');
            video = document.createElement('video');
            video.autoplay = true;
            video.loop = true;
            
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            
            // Load model
            fetch('/api/load_model', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({model_path: 'yolov8s.pt'})
            }).then(r => r.json()).then(data => {
                if(data.success) showStatus(data.message, 'success');
            });
        };
        
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            videoFile = file;
            const url = URL.createObjectURL(file);
            video.src = url;
            video.onloadeddata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                showStatus('File loaded successfully', 'success');
            };
        }
        
        function startProcessing() {
            if(!videoFile) {
                showStatus('Please load a video/image first', 'error');
                return;
            }
            
            processing = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            processFrame();
        }
        
        function stopProcessing() {
            processing = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            showStatus('Processing stopped', 'success');
        }
        
        function processFrame() {
            if(!processing) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            const conf = parseFloat(document.getElementById('confidence').value);
            
            fetch('/api/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image: imageData, confidence: conf})
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    img.src = data.image;
                    
                    updateStats(data.stats);
                }
                
                if(processing) setTimeout(processFrame, 100);
            })
            .catch(err => {
                console.error(err);
                if(processing) setTimeout(processFrame, 100);
            });
        }
        
        function updateStats(stats) {
            document.getElementById('totalVehicles').textContent = stats.total_vehicles;
            document.getElementById('avgAccuracy').textContent = stats.avg_accuracy + '%';
            
            const priorityRoad = stats.priority_road + 1;
            const greenTime = stats.roads[stats.priority_road]?.green_time || 30;
            document.getElementById('priorityRoad').textContent = `Road ${priorityRoad}`;
            document.getElementById('priorityTime').textContent = `Green: ${greenTime}s`;
            
            if(stats.congested_roads.length > 0) {
                document.getElementById('congestedInfo').style.display = 'block';
                document.getElementById('congestedList').textContent = 
                    stats.congested_roads.map(r => `Road ${r+1}`).join(', ');
            } else {
                document.getElementById('congestedInfo').style.display = 'none';
            }
            
            const tbody = document.getElementById('metricsBody');
            tbody.innerHTML = '';
            stats.roads.forEach(road => {
                const row = tbody.insertRow();
                const densityClass = road.density > 50 ? 'congested' : 'normal';
                row.innerHTML = `
                    <td>Road ${road.id + 1}</td>
                    <td>${road.vehicles}</td>
                    <td class="${densityClass}">${road.density}%</td>
                    <td>${road.green_time}s</td>
                    <td>${road.wait_time}s</td>
                    <td>${road.accuracy}%</td>
                    <td>${road.precision}%</td>
                    <td>${road.recall}%</td>
                    <td>${road.f1_score}%</td>
                `;
            });
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
